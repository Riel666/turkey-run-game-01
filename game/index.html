<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Run — The Great Escape</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #2e1a0a;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #wrap { text-align: center; }
  canvas {
    display: block;
    width: min(96vw, 960px);
    height: auto;
    image-rendering: auto;
    background: #f7c873;
    border: 4px solid #e8a83c;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    cursor: pointer;
  }
  #hint {
    color: #ffe9b8;
    font-size: 14px;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hint">SPACE / click — jump &nbsp;·&nbsp; ↓ — duck &amp; hide &nbsp;·&nbsp; R — restart &nbsp;·&nbsp; P — pause &nbsp;·&nbsp; M — sound</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
